name: home_energy_monitor
description: IoT Home Automation & Energy Monitoring System

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # State Management
  provider: ^6.1.2

  # Real-time (Socket.IO)
  socket_io_client: ^2.0.3+1

  # Local Storage (JWT token, user prefs)
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Charts
  fl_chart: ^0.67.0

  # UI
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.19.0
  logger: ^2.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
